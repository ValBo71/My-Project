<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход | Каталог за Щанци & Клишета</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-color: #f1f5f9;
      --panel-bg: #ffffff;
      --panel-bg-secondary: #f8fafc;
      --panel-border: rgba(0, 0, 0, 0.08);
      --text-color: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #ef4444;
      --card-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-headers: 'Manrope', sans-serif;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .login-card {
      width: 100%;
      max-width: 380px;
      background-color: var(--panel-bg);
      border: 1px solid var(--panel-border);
      box-shadow: var(--card-shadow);
      padding: 2rem;
    }
    .login-title {
      font-family: var(--font-headers);
      font-weight: 800;
      font-size: 1.3rem;
      margin-bottom: 0.35rem;
    }
    .login-subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.85rem; margin-bottom: 0.4rem; color: var(--text-muted); }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 0.7rem 0.85rem;
      background: var(--panel-bg-secondary);
      border: 1px solid var(--panel-border);
      color: var(--text-color);
      font-family: var(--font-main);
      font-size: 0.95rem;
      outline: none;
    }
    input:focus { border-color: var(--primary); }
    .btn-submit {
      width: 100%;
      padding: 0.75rem;
      margin-top: 0.5rem;
      background-color: var(--primary);
      color: #fff;
      border: none;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .btn-submit:hover { background-color: var(--primary-hover); }
    .error-box {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid var(--danger);
      color: #b91c1c;
      padding: 0.65rem 0.85rem;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-title">Каталог за Щанци & Клишета</div>
    <div class="login-subtitle">Моля, влезте с вашия акаунт</div>

    {% if error %}
    <div class="error-box">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
      <div class="form-group">
        <label for="username">Потребителско име</label>
        <input type="text" id="username" name="username" autofocus required>
      </div>
      <div class="form-group">
        <label for="password">Парола</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn-submit">Вход</button>
    </form>
  </div>
</body>
</html>
