# Builds the Car Maintenance packages and installers for a carmaintenance-v* tag and
# publishes them as a GitHub Release. The small installers on the website download the
# package of exactly this release and check its SHA-256.
#
#   git tag carmaintenance-v1.1.0 && git push origin carmaintenance-v1.1.0
name: Car Maintenance release

on:
  push:
    tags:
      - 'carmaintenance-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build packages and installers
        run: python "09. Other tools/01.Car maintenance/installer/build.py" --tag "$GITHUB_REF_NAME" --out dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#carmaintenance-v}"
          cat > notes.md <<EOF
          Car Maintenance $version

          Download the installer for your system from the website, or from here:
          - Windows 10/11 x64: CarMaintenance-Windows-Setup.exe
          - macOS (Intel and Apple Silicon): CarMaintenance-macOS-Install.zip, then open Install Car Maintenance.command

          The installers download the matching CarMaintenance-<platform>.zip package of this release and check its SHA-256 (see SHA256SUMS.txt). A new installation starts with an empty database.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --title "Car Maintenance $version" --notes-file notes.md
